name: ci

on:
  push:
    paths: ["contracts/**", "app/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["contracts/**"]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: contracts }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Unit tests
        run: cargo test --workspace
      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown --workspace
      - name: Optimize wasm
        run: |
          npm install -g binaryen
          mkdir -p ../out
          for f in agenthub mock_usdc; do wasm-opt -Oz --strip-debug --enable-bulk-memory --enable-nontrapping-float-to-int -o ../out/$f.wasm target/wasm32-unknown-unknown/release/$f.wasm; done
          ls -la ../out
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: out/*.wasm

  app-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: app }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run gen-samples -- --count 60 --seed 7
