name: ci

on:
  push:
    paths: ["contracts/**", "app/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["contracts/**"]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: contracts }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Unit tests
        run: cargo test --workspace
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: Build hub
        run: cargo near build non-reproducible-wasm --manifest-path hub/Cargo.toml
      - name: Build mock-usdc
        run: cargo near build non-reproducible-wasm --manifest-path mock-usdc/Cargo.toml
      - name: Collect wasm
        run: |
          mkdir -p ../out
          cp target/near/agenthub/agenthub.wasm ../out/
          cp target/near/mock_usdc/mock_usdc.wasm ../out/
          ls -la ../out
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: out/*.wasm

  app-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: app }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run typecheck
      - run: npm run gen-samples -- --count 60 --seed 7
