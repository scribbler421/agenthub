[workspace]
resolver = "2"
members = ["hub", "mock-usdc"]

[workspace.dependencies]
near-sdk = { version = "5", features = ["unstable"] }
near-contract-standards = "5"
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
